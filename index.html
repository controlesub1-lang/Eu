<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xandó Express | Barbearia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#D4AF37', dark: '#121212' } } } }
    </script>
</head>
<body class="bg-[#121212] text-white font-sans">
    <main class="max-w-md mx-auto p-6">
        <header class="text-center py-10">
            <h1 class="text-4xl font-bold text-[#D4AF37]">Xandó Express</h1>
            <p class="text-gray-400 mt-2">Estilo e Precisão</p>
        </header>
        <section class="space-y-4">
            <button class="w-full py-4 bg-[#D4AF37] text-black font-bold rounded-lg">Agendar Horário</button>
            <button class="w-full py-4 border border-[#D4AF37] text-[#D4AF37] rounded-lg">Nossos Serviços</button>
        </section>
    </main>
</body>
</html>
